# Studio-Komp — samodzielna instancja nginx tylko dla sk.mati-it.pl.
# Nie rusza głównego nginx.conf (obsługuje file-uploader). Ruch przychodzi
# wyłącznie przez Cloudflare Tunnel na 127.0.0.1:8088.
# Instalowana jako /etc/nginx/nginx-sk.conf, uruchamiana usługą nginx-sk.service.

user www-data;
worker_processes auto;
pid /run/nginx-sk.pid;
error_log /var/log/nginx/sk.error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    charset utf-8;

    access_log /var/log/nginx/sk.access.log;

    server {
        listen 127.0.0.1:8088;
        server_name sk.mati-it.pl;

        # Przekierowania mają być względne — inaczej nginx dokleja wewnętrzny
        # port 8088 do Location (użytkownik widzi https://sk.mati-it.pl/cennik/).
        absolute_redirect off;

        root /var/www/sk.mati-it.pl;
        index index.html;

        # Astro generuje katalogi z index.html (trailingSlash: always)
        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # Pliki ukryte (np. .htaccess, .git) nie są serwowane
        location ~ /\.(?!well-known) {
            deny all;
        }

        # --- Panel edycji /edycja (Decap CMS + decap-server) ---
        # HTML panelu leży w public/edycja/, a żądania API idą do usługi
        # studio-komp-cms na 127.0.0.1:8081. Dostęp chroni hasło (basic auth);
        # decap-server sam nie ma żadnego uwierzytelniania.
        location = /edycja        { return 301 /edycja/; }
        location = /admin         { return 301 /edycja/; }
        location = /admin/        { return 301 /edycja/; }

        location = /edycja/config.yml {
            auth_basic "Panel edycji Studio-Komp";
            auth_basic_user_file /etc/nginx/sk-edycja.htpasswd;
            # Decap akceptuje config tylko z Content-Type zawierającym "yaml".
            default_type text/yaml;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location /edycja/api/ {
            auth_basic "Panel edycji Studio-Komp";
            auth_basic_user_file /etc/nginx/sk-edycja.htpasswd;
            client_max_body_size 25m;
            proxy_http_version 1.1;
            # decap-server binduje się na 127.0.0.1 i w tym trybie akceptuje
            # wyłącznie żądania z Host: localhost/127.0.0.1. Prawdziwy adres
            # przekazujemy w X-Forwarded-Host.
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:8081/api/;
            # Build po zapisie potrafi potrwać kilkadziesiąt sekund.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /edycja/ {
            auth_basic "Panel edycji Studio-Komp";
            auth_basic_user_file /etc/nginx/sk-edycja.htpasswd;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ =404;
        }

        # --- Przekierowania 301 ze starej strony (spójne z public/_redirects) ---
        location = /o-firmie.html          { return 301 /o-serwisie/; }
        location = /oferta/                { return 301 /uslugi/; }
        location = /cennik.html            { return 301 /cennik/; }
        location = /galeria.html           { return 301 /realizacje/; }
        location = /kontakt.html           { return 301 /kontakt/; }
        location = /aktualnosci/           { return 301 /poradnik/; }
        location = /aktualnosci/index.html { return 301 /poradnik/; }
        location = /mapa                   { return 301 /kontakt/; }
        location = /mapa/                  { return 301 /kontakt/; }
        location = /googleads              { return 301 /lp/naprawa-laptopow/; }
        location = /googleads/             { return 301 /lp/naprawa-laptopow/; }
        location = /oferta/czyszczenie-i-konserwacja-ukladu-chlodzenia.html { return 301 /czyszczenie-laptopa-wroclaw/; }
        location = /aktualnosci/dlaczego-warto-nas-wybrac.html { return 301 /o-serwisie/; }

        # --- Kompresja ---
        gzip on;
        gzip_vary on;
        gzip_min_length 512;
        gzip_proxied any;
        gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

        # --- Cache ---
        location ~* \.(css|js|woff2)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(svg|png|jpg|jpeg|webp|avif|ico)$ {
            add_header Cache-Control "public, max-age=15552000";
            access_log off;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Manifest PWA — poprawny typ MIME
        location = /site.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "public, max-age=86400";
        }

        # --- Nagłówki bezpieczeństwa ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
