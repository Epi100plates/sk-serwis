# Studio-Komp — samodzielna instancja nginx dla sk.mati-it.pl.
# Ruch przychodzi wyłącznie przez Cloudflare Tunnel na 127.0.0.1:8088.
# Instalowana jako /etc/nginx/nginx-sk.conf, uruchamiana usługą nginx-sk.service.
# Zawiera: stronę statyczną (Astro), panel CMS /panel (PHP-FPM), endpoint
# pomiaru /api/e, publiczne API formularza zgłoszeń (/api/form-token,
# /api/zgloszenie), podgląd wersji roboczych /podglad (basic auth).

user www-data;
worker_processes auto;
pid /run/nginx-sk.pid;
error_log /var/log/nginx/sk.error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    charset utf-8;

    access_log /var/log/nginx/sk.access.log;

    # Panel CMS działa w osobnym poolu PHP-FPM jako użytkownik skcms
    # (ten sam, który jest właścicielem repozytorium treści).
    upstream sk_php {
        server unix:/run/php/php8.3-fpm-sk.sock;
    }

    server {
        listen 127.0.0.1:8088;
        server_name sk.mati-it.pl;

        absolute_redirect off;

        root /var/www/sk.mati-it.pl;
        index index.html;

        client_max_body_size 20m;

        include /etc/nginx/sk-redirects.conf;

        # --- Strona statyczna (Astro) ---
        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }

        # --- Panel CMS /panel ---
        location = /panel {
            return 301 /panel/;
        }

        location ^~ /panel/assets/ {
            alias /srv/studio-komp/panel/assets/;
            access_log off;
            add_header Cache-Control "no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ^~ /panel/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/studio-komp/panel/index.php;
            fastcgi_param SCRIPT_NAME /panel/index.php;
            fastcgi_param DOCUMENT_ROOT /srv/studio-komp/panel;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_pass sk_php;
        }

        # --- Endpoint własnej analityki (sendBeacon) ---
        location = /api/e {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/studio-komp/panel/api/e.php;
            fastcgi_param SCRIPT_NAME /api/e;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_pass sk_php;
        }

        # --- Formularz zgłoszeń serwisowych (publiczne API, bez sesji panelu) ---
        # Token formularza: wyłącznie GET.
        location = /api/form-token {
            limit_except GET { deny all; }
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/studio-komp/panel/api/form-token.php;
            fastcgi_param SCRIPT_NAME /api/form-token;
            fastcgi_param DOCUMENT_ROOT /srv/studio-komp/panel;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_pass sk_php;
        }

        # Wysłanie zgłoszenia: wyłącznie POST.
        location = /api/zgloszenie {
            limit_except POST { deny all; }
            client_max_body_size 32k;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/studio-komp/panel/api/form.php;
            fastcgi_param SCRIPT_NAME /api/zgloszenie;
            fastcgi_param DOCUMENT_ROOT /srv/studio-komp/panel;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_pass sk_php;
        }

        location /api/ {
            return 404;
        }

        # --- Podgląd wersji roboczych (tylko za hasłem, noindex) ---
        location = /podglad {
            return 301 /podglad/;
        }

        location ^~ /podglad/ {
            auth_basic "Podgląd Studio-Komp";
            auth_basic_user_file /etc/nginx/sk-preview.htpasswd;
            alias /var/www/sk-preview/;
            index index.html;
            try_files $uri $uri/ $uri/index.html =404;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # --- Zgodność: stary panel Decap → nowy panel ---
        location /edycja/ {
            return 301 /panel/;
        }
        location = /edycja {
            return 301 /panel/;
        }
        location = /admin {
            return 301 /panel/;
        }
        location = /admin/ {
            return 301 /panel/;
        }

        # --- Bezpieczeństwo uploadów: żadnych plików wykonywalnych ---
        location ~* /images/uploads/.*\.(php|phtml|phar|cgi|pl|py|sh)$ {
            deny all;
        }

        # --- Kompresja ---
        gzip on;
        gzip_vary on;
        gzip_min_length 512;
        gzip_proxied any;
        gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

        # --- Cache ---
        location ~* \.(css|js|woff2)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(svg|png|jpg|jpeg|webp|avif|ico)$ {
            add_header Cache-Control "public, max-age=15552000";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        location = /index.html {
            # Uwaga: add_header w lokalizacji blokuje dziedziczenie nagłówków
            # bezpieczeństwa z poziomu server, dlatego używamy expires.
            expires -1;
        }

        location = /site.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "public, max-age=86400";
        }

        # --- Nagłówki bezpieczeństwa ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
