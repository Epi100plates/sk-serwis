# Panel edycji Studio-Komp (Decap CMS).
# Działa przez serwer proxy (decap-server) uruchomiony na VPS:
#   https://sk.mati-it.pl/edycja/api/v1
# Zmiany zapisują się jako commit w repozytorium /srv/studio-komp,
# a usługa studio-komp-publish przebudowuje stronę i publikuje ją w /var/www.
backend:
  name: proxy
  proxy_url: /edycja/api/v1
  branch: main

locale: pl
site_url: https://sk.mati-it.pl
display_url: https://sk.mati-it.pl
logo_url: /favicon.svg

media_folder: public/images/uploads
public_folder: /images/uploads
collections:
  - name: uslugi
    label: Podstrony usług
    label_singular: Podstrona usługi
    folder: src/content/uslugi
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "{{slug}}"
    fields:
      - { name: title, label: Tytuł SEO (meta title), widget: string }
      - { name: navLabel, label: Nazwa w menu, widget: string }
      - { name: description, label: Opis SEO (meta description), widget: text }
      - { name: h1, label: Nagłówek H1, widget: string }
      - { name: lead, label: Lead pod H1, widget: text }
      - { name: teaser, label: Jedno zdanie do listy usług, widget: string }
      - name: group
        label: Kategoria
        widget: select
        options: [Konserwacja, Naprawy, Elektronika, "System i dane"]
      - { name: order, label: Kolejność, widget: number, default: 50, value_type: int }
      - { name: featured, label: Pokazuj na stronie głównej, widget: boolean, default: false }
      - { name: priceFrom, label: Cena (np. od 200 zł), widget: string, required: false }
      - { name: priceNote, label: Uwaga do ceny, widget: string, required: false }
      - { name: duration, label: Czas realizacji, widget: string, required: false }
      - name: includes
        label: "Co obejmuje usługa"
        widget: list
        required: false
      - name: problems
        label: Objawy / problemy klienta
        widget: list
        required: false
      - name: faq
        label: Pytania i odpowiedzi
        widget: list
        required: false
        fields:
          - { name: question, label: Pytanie, widget: string }
          - { name: answer, label: Odpowiedź, widget: text }
      - name: related
        label: Powiązane usługi (slugi)
        widget: list
        required: false
        hint: "np. naprawa-plyt-glownych"
      - { name: updated, label: Data aktualizacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false, required: false }
      - { name: draft, label: Szkic (nie publikuj), widget: boolean, default: false }
      - { name: body, label: Treść strony, widget: markdown }

  - name: blog
    label: Poradnik (blog)
    label_singular: Artykuł
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "poradnik/{{slug}}"
    fields:
      - { name: title, label: Tytuł artykułu, widget: string }
      - { name: description, label: Opis SEO (meta description), widget: text }
      - { name: pubDate, label: Data publikacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { name: updatedDate, label: Data aktualizacji, widget: datetime, date_format: YYYY-MM-DD, time_format: false, required: false }
      - name: category
        label: Kategoria
        widget: select
        options: [Naprawa, Konserwacja, Wydajność, "Dane i system", "Zakup i modernizacja", Poradnik]
      - { name: service, label: Powiązana usługa (slug), widget: string, required: false, hint: "np. naprawa-laptopa-po-zalaniu" }
      - name: faq
        label: Pytania i odpowiedzi
        widget: list
        required: false
        fields:
          - { name: question, label: Pytanie, widget: string }
          - { name: answer, label: Odpowiedź, widget: text }
      - { name: draft, label: Szkic (nie publikuj), widget: boolean, default: false }
      - { name: body, label: Treść artykułu, widget: markdown }

  - name: cennik
    label: Cennik
    files:
      - name: cennik
        label: Cennik usług
        file: src/data/cennik.json
        format: json
        fields:
          - { name: lead, label: Wstęp nad cennikiem, widget: text }
          - { name: expressSurcharge, label: Dopłata za ekspres (zł), widget: number, value_type: int }
          - name: groups
            label: Grupy cen
            widget: list
            fields:
              - { name: title, label: Nazwa grupy, widget: string }
              - name: items
                label: Pozycje
                widget: list
                fields:
                  - { name: name, label: Usługa, widget: string }
                  - { name: price, label: Cena, widget: string, hint: "np. 200–250 zł, od 200 zł, 350 zł, … zł" }
                  - { name: note, label: Uwaga, widget: string, required: false }

  - name: opinie
    label: Opinie
    files:
      - name: opinie
        label: Opinie Google
        file: src/data/opinie.json
        format: json
        fields:
          - name: items
            label: Opinie
            widget: list
            fields:
              - { name: name, label: Imię / podpis, widget: string }
              - { name: rating, label: Ocena (1–5), widget: number, value_type: int, default: 5 }
              - { name: text, label: Treść opinii, widget: text }
              - { name: highlight, label: Wyróżnione zdanie (opcjonalnie), widget: string, required: false }

  - name: realizacje
    label: Realizacje
    files:
      - name: realizacje
        label: Galeria realizacji
        file: src/data/realizacje.json
        format: json
        fields:
          - name: items
            label: Realizacje
            widget: list
            fields:
              - { name: title, label: Tytuł, widget: string }
              - { name: category, label: Kategoria, widget: string }
              - { name: device, label: Sprzęt, widget: string, required: false }
              - { name: summary, label: Opis, widget: text }
              - { name: image, label: Zdjęcie (opcjonalnie), widget: image, required: false, hint: "Jeśli puste — użyta zostanie grafika techniczna." }
              - name: art
                label: Grafika techniczna
                widget: select
                required: false
                options: [case-liquid, case-board, case-screen, case-cooling, case-socket, case-power, case-hinge]
              - { name: hours, label: Czas realizacji, widget: string, required: false }

  - name: wideo
    label: Wideo
    files:
      - name: wideo
        label: Filmy z warsztatu
        file: src/data/wideo.json
        format: json
        fields:
          - name: items
            label: Filmy
            widget: list
            fields:
              - { name: title, label: Tytuł filmu, widget: string }
              - { name: youtubeId, label: ID filmu YouTube, widget: string, required: false, hint: "np. dQw4w9WgXcQ — sekcja pojawi się po dodaniu filmu." }
              - { name: poster, label: Miniatura (opcjonalnie), widget: image, required: false }
              - { name: duration, label: Długość, widget: string, required: false }

  - name: site
    label: Dane firmy i ustawienia
    files:
      - name: site
        label: Ustawienia strony
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: Nazwa, widget: string }
          - { name: claim, label: Claim, widget: string }
          - { name: phoneDisplay, label: Telefon (wyświetlany), widget: string }
          - { name: phoneTel, label: Telefon (do linku tel:), widget: string }
          - name: address
            label: Adres
            widget: object
            fields:
              - { name: street, label: Ulica, widget: string }
              - { name: postalCode, label: Kod pocztowy, widget: string }
              - { name: city, label: Miasto, widget: string }
              - { name: lat, label: Szerokość geogr., widget: number, value_type: float }
              - { name: lng, label: Długość geogr., widget: number, value_type: float }
          - { name: mapsUrl, label: Link do Google Maps, widget: string }
          - { name: directionsUrl, label: Link do nawigacji, widget: string }
          - name: hours
            label: Godziny pracy
            widget: list
            fields:
              - { name: label, label: Dzień, widget: string }
              - { name: value, label: Godziny, widget: string }
              - { name: open, label: Otwarte, widget: boolean, default: true }
          - { name: founded, label: Rok rozpoczęcia działalności, widget: number, value_type: int }
          - name: reviews
            label: Opinie Google
            widget: object
            fields:
              - { name: rating, label: Ocena, widget: number, value_type: float }
              - { name: count, label: Liczba opinii, widget: number, value_type: int }
              - { name: countLabel, label: Liczba opinii (etykieta), widget: string }
              - { name: url, label: Link do opinii, widget: string }
              - { name: writeUrl, label: Link do dodania opinii, widget: string }
          - name: express
            label: Usługa ekspresowa
            widget: object
            fields:
              - { name: surcharge, label: Dopłata (zł), widget: number, value_type: int }
          - name: analytics
            label: Analityka
            widget: object
            fields:
              - { name: gtm, label: Google Tag Manager (ID), widget: string, required: false }
              - { name: ga4, label: Google Analytics 4 (ID), widget: string, required: false }
              - { name: adsConversionSendTo, label: "Google Ads — send_to (np. AW-123456789/abc)", widget: string, required: false }
          - name: form
            label: Formularz
            widget: object
            fields:
              - { name: accessKey, label: Web3Forms access key (opcjonalnie), widget: string, required: false }

  - name: landing
    label: Landing page (Google Ads)
    files:
      - name: landing
        label: Landing page
        file: src/data/landing.json
        format: json
        fields:
          - name: items
            label: Strony
            widget: list
            fields:
              - { name: slug, label: Adres (/lp/slug/), widget: string }
              - { name: metaTitle, label: Tytuł SEO, widget: string }
              - { name: metaDescription, label: Opis SEO, widget: text }
              - { name: h1, label: Nagłówek H1, widget: string }
              - { name: lead, label: Lead, widget: text }
              - { name: price, label: Cena, widget: string }
              - { name: bullets, label: Punkty, widget: list }
              - { name: service, label: Powiązana usługa (slug), widget: string }
